<!DOCTYPE html><html><head><style>
html{background:#FFFFFF;} body{width:720pt;height:405pt;margin:0;padding:0;display:flex;font-family:Arial,sans-serif;}
.page{width:100%;height:100%;padding:32pt 48pt;box-sizing:border-box}
.page .header{display:flex;align-items:baseline;gap:12pt;margin-bottom:10pt}
.page .header .num{font-size:11pt;color:#C15937;font-weight:bold}
.page .header h1{font-size:24pt;color:#2C2C2C;margin:0}
.page .grid{display:flex;flex-wrap:wrap;gap:8pt}
.page .item{flex:0 0 calc(50% - 4pt);display:flex;align-items:flex-start;gap:8pt;padding:8pt 12pt;background:#F4F1DE;border-radius:6pt}
.page .item .icon{width:24pt;height:24pt;border-radius:6pt;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page .item .icon p{font-size:13pt;font-weight:bold;color:#FFFFFF;margin:0}
.page .item:nth-child(1) .icon{background:#4A7C59} .item:nth-child(2) .icon{background:#C15937}
.page .item:nth-child(3) .icon{background:#4A7C59} .item:nth-child(4) .icon{background:#C15937}
.page .item:nth-child(5) .icon{background:#2C2C2C}
.page .item .txt h3{font-size:11pt;color:#2C2C2C;margin:0 0 2pt 0}
.page .item .txt p{font-size:9.5pt;color:#7F8C8D;margin:0;line-height:1.3}
</style></head><body><div class="page">
<div class="header"><p class="num">系统特征</p><h1>系统五大特征在都江堰中的体现</h1></div>
<div class="grid">
<div class="item"><div class="icon"><p>1</p></div><div class="txt"><h3>整体性</h3><p>三大工程形成不可分割的有机整体，缺一不可</p></div></div>
<div class="item"><div class="icon"><p>2</p></div><div class="txt"><h3>相关性</h3><p>鱼嘴分水比变化 → 飞沙堰溢流量相应变化</p></div></div>
<div class="item"><div class="icon"><p>3</p></div><div class="txt"><h3>目的性</h3><p>"分四六、平潦旱"——防洪灌溉双目标</p></div></div>
<div class="item"><div class="icon"><p>4</p></div><div class="txt"><h3>动态性</h3><p>弯道环流随水位自动调节，全年无需人为干预</p></div></div>
<div class="item"><div class="icon"><p>5</p></div><div class="txt"><h3>环境适应性</h3><p>顺应岷江水文，无坝引水，低影响开发</p></div></div>
</div></div></body></html>
