<!DOCTYPE html><html><head><style>
html{background:#FFFFFF;} body{width:720pt;height:405pt;margin:0;padding:0;display:flex;font-family:Arial,sans-serif;}
.page{width:100%;height:100%;padding:32pt 48pt;box-sizing:border-box}
.page .header{display:flex;align-items:baseline;gap:12pt;margin-bottom:18pt}
.page .header .num{font-size:11pt;color:#C15937;font-weight:bold}
.page .header h1{font-size:26pt;color:#2C2C2C;margin:0}
.page .grid{display:flex;gap:20pt}
.page .col{flex:1}
.page .card{background:#F4F1DE;padding:16pt;border-radius:6pt;margin-bottom:12pt}
.page .card h3{font-size:13pt;color:#4A7C59;margin:0 0 6pt 0}
.page .card p{font-size:11pt;color:#2C2C2C;line-height:1.5;margin:0}
.page .card .note{font-size:9.5pt;color:#7F8C8D;margin-top:4pt}
</style></head><body><div class="page">
<div class="header"><p class="num">课程标准</p><h1>课程依据与素养目标</h1></div>
<div class="grid">
<div class="col">
<div class="card" style="border-left:3pt solid #4A7C59"><h3>内容要求</h3><p>理解系统五特征（整体性/相关性/目的性/动态性/环境适应性）；运用系统分析方法分析简单系统；了解系统优化的基本概念和一般步骤。</p></div>
<div class="card" style="border-left:3pt solid #4A7C59"><h3>核心素养</h3><p><b>工程思维（水平3）</b>：能对简单系统进行分析和优化<br/><b>技术意识</b>：理解技术对社会和环境的双重影响</p></div>
</div>
<div class="col">
<div class="card" style="border-left:3pt solid #C15937"><h3>学业质量</h3><p>水平3：运用系统分析方法，从整体性/相关性/目的性等角度分析技术系统，撰写分析报告</p></div>
<div class="card" style="border-left:3pt solid #C15937"><h3>教学建议</h3><p>以真实工程系统为分析对象，在"分析→建模→优化→迁移"中发展系统思维</p></div>
</div>
</div></div></body></html>
