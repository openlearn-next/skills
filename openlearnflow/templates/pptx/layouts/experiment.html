<!DOCTYPE html><html><head><style>
html{background:#FFFFFF;} body{width:720pt;height:405pt;margin:0;padding:0;display:flex;font-family:Arial,sans-serif;}
.page{width:100%;height:100%;padding:32pt 48pt;box-sizing:border-box}
.page .header{display:flex;align-items:baseline;gap:12pt;margin-bottom:14pt}
.page .header .num{font-size:11pt;color:#C15937;font-weight:bold}
.page .header h1{font-size:26pt;color:#2C2C2C;margin:0}
.page .grid{display:flex;gap:16pt}
.page .col{flex:1}
.page .step{display:flex;align-items:flex-start;gap:8pt;margin-bottom:8pt}
.page .step .n{width:20pt;height:20pt;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page .col:nth-child(1) .step .n{background:#4A7C59;color:#FFFFFF}
.page .col:nth-child(2) .step .n{background:#C15937;color:#FFFFFF}
.page .step .n p{font-size:10pt;font-weight:bold;margin:0}
.page .step .txt{font-size:10pt;color:#2C2C2C;line-height:1.4}
.page .safety{background:#FFF3CD;border-left:3pt solid #FFC107;padding:8pt 12pt;border-radius:4pt;margin-top:10pt}
.page .safety p{font-size:9.5pt;color:#856404;margin:2pt 0}
</style></head><body><div class="page">
<div class="header"><p class="num">动手验证</p><h1>弯道环流实验步骤</h1></div>
<div class="grid">
<div class="col">
<div class="step"><div class="n"><p>1</p></div><p class="txt">搭建弯道水槽实验装置（亚克力水槽 + 水泵），填充沙粒模拟泥沙</p></div>
<div class="step"><div class="n"><p>2</p></div><p class="txt">开启水泵，观察水流表面流向和底层流向的差异</p></div>
<div class="step"><div class="n"><p>3</p></div><p class="txt">观察泥沙在凸岸沉积、凹岸冲刷的分布规律</p></div>
<div class="step"><div class="n"><p>4</p></div><p class="txt">调节水泵功率（模拟丰水/枯水），记录内江外江分水比例变化</p></div>
</div>
<div class="col">
<div class="step"><div class="n"><p>5</p></div><p class="txt">在弯道后设置溢流堰，模拟飞沙堰的溢流排沙功能</p></div>
<div class="step"><div class="n"><p>6</p></div><p class="txt">记录数据：水位高度、内外侧流量比、排沙效率</p></div>
<div class="step"><div class="n"><p>7</p></div><p class="txt">绘制"水位—分水比"关系曲线，总结弯道环流规律</p></div>
<div class="safety"><p><b>安全提示</b></p><p>防水防滑 · 注意电器安全 · 实验后清理水渍</p></div>
</div>
</div></div></body></html>
