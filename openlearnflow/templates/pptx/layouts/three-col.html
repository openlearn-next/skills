<!DOCTYPE html><html><head><style>
html{background:#FFFFFF;} body{width:720pt;height:405pt;margin:0;padding:0;display:flex;font-family:Arial,sans-serif;}
.page{width:100%;height:100%;padding:32pt 48pt;box-sizing:border-box}
.page .header{display:flex;align-items:baseline;gap:12pt;margin-bottom:16pt}
.page .header .num{font-size:11pt;color:#C15937;font-weight:bold}
.page .header h1{font-size:26pt;color:#2C2C2C;margin:0}
.page .cards{display:flex;gap:14pt}
.page .card{flex:1;background:#FFFFFF;border-radius:6pt;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.page .card .top{padding:14pt 16pt 10pt;color:#FFFFFF;font-size:14pt;font-weight:bold}
.page .card:nth-child(1) .top{background:#4A7C59}
.page .card:nth-child(2) .top{background:#C15937}
.page .card:nth-child(3) .top{background:#2C2C2C}
.page .card .body{padding:12pt 16pt}
.page .card .body p{font-size:10.5pt;color:#2C2C2C;line-height:1.5;margin:0 0 4pt 0}
</style></head><body><div class="page">
<div class="header"><p class="num">系统结构</p><h1>三大工程子系统</h1></div>
<div class="cards">
<div class="card"><div class="top"><p>鱼嘴 — 分水堤</p></div><div class="body"><p>位于岷江中心，将岷江分为内江和外江</p><p>利用弯道环流原理自动调节分水比</p><p><b>丰水期 4:6 / 枯水期 6:4</b></p></div></div>
<div class="card"><div class="top"><p>飞沙堰 — 溢洪道</p></div><div class="body"><p>连接内江与外江的溢流堰</p><p>水位过高时自动溢流入外江</p><p><b>离心力排沙 · 负反馈机制</b></p></div></div>
<div class="card"><div class="top"><p>宝瓶口 — 引水口</p></div><div class="body"><p>凿穿玉垒山形成的人工引水口</p><p>形似瓶颈控制进入成都平原水量</p><p><b>2000年至今位置未变</b></p></div></div>
</div></div></body></html>
