<!DOCTYPE html><html><head><style>
html{background:#FFFFFF;} body{width:720pt;height:405pt;margin:0;padding:0;display:flex;font-family:Arial,sans-serif;}
.page{width:100%;height:100%;padding:32pt 48pt;box-sizing:border-box}
.page .header{display:flex;align-items:baseline;gap:12pt;margin-bottom:16pt}
.page .header .num{font-size:11pt;color:#C15937;font-weight:bold}
.page .header h1{font-size:26pt;color:#2C2C2C;margin:0}
.page .quote{font-size:16pt;color:#2C2C2C;text-align:center;font-style:italic;margin:0 0 16pt 0}
.page .task{background:#F4F1DE;padding:18pt;border-radius:6pt;border-left:5pt solid #C15937;margin-bottom:14pt}
.page .task h3{font-size:14pt;color:#C15937;margin:0 0 8pt 0}
.page .task p{font-size:11pt;color:#2C2C2C;line-height:1.5;margin:0}
.page .task .constraints{font-size:10pt;color:#7F8C8D;margin-top:8pt}
.page .tools{display:flex;gap:0;flex-wrap:wrap}
.page .tool{flex:1;background:#4A7C59;color:#FFFFFF;text-align:center;padding:8pt 6pt}
.page .tool p{font-size:9pt;margin:0}
</style></head><body><div class="page">
<div class="header"><p class="num">能力迁移</p><h1>从都江堰到你的世界</h1></div>
<p class="quote">"你学到的系统分析方法，能迁移到什么现实问题？"</p>
<div class="task"><h3>迁移任务：社区雨水收集系统</h3><p>某城市20万人社区需设计雨水收集系统。请运用系统分析方法，设计"集水 → 过滤 → 储水 → 分配"的系统方案。</p><p class="constraints">约束条件：预算500万元 · 年均降雨量800mm · 地形起伏5–15m</p></div>
<div class="tools">
<div class="tool"><p>系统边界定义</p></div><div class="tool" style="background:#6B9D73"><p>子系统分解</p></div><div class="tool"><p>I/O 分析</p></div><div class="tool" style="background:#6B9D73"><p>约束识别</p></div><div class="tool"><p>方案比较</p></div><div class="tool" style="background:#6B9D73"><p>实施验证</p></div>
</div></div></body></html>
