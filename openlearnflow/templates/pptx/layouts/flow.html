<!DOCTYPE html><html><head><style>
html{background:#FFFFFF;} body{width:720pt;height:405pt;margin:0;padding:0;display:flex;font-family:Arial,sans-serif;}
.page{width:100%;height:100%;padding:32pt 48pt;box-sizing:border-box}
.page .header{display:flex;align-items:baseline;gap:12pt;margin-bottom:20pt}
.page .header .num{font-size:11pt;color:#C15937;font-weight:bold}
.page .header h1{font-size:26pt;color:#2C2C2C;margin:0}
.page .flow{display:flex;align-items:center;gap:0;margin-bottom:20pt}
.page .step{background:#4A7C59;color:#FFFFFF;padding:10pt 14pt;border-radius:6pt;text-align:center}
.page .step p{font-size:11pt;font-weight:bold;margin:0}
.page .arrow{color:#C15937;font-size:18pt;padding:0 4pt}
.page .boxes{display:flex;gap:12pt;margin-top:14pt}
.page .box{flex:1;background:#F4F1DE;padding:12pt;border-radius:6pt}
.page .box h3{font-size:12pt;margin:0 0 6pt 0}
.page .box:nth-child(1) h3{color:#4A7C59} .page .box:nth-child(2) h3{color:#4A7C59}
.page .box:nth-child(3) h3{color:#C15937} .page .box:nth-child(4) h3{color:#C15937}
.page .box p{font-size:10pt;color:#2C2C2C;line-height:1.4;margin:0}
</style></head><body><div class="page">
<div class="header"><p class="num">分析方法</p><h1>白箱法 — 系统分析五步法</h1></div>
<div class="flow">
<div class="step"><p>识别系统</p></div><p class="arrow">→</p>
<div class="step"><p>分解子系统</p></div><p class="arrow">→</p>
<div class="step"><p>分析关系</p></div><p class="arrow">→</p>
<div class="step"><p>识别反馈</p></div><p class="arrow">→</p>
<div class="step"><p>提出优化</p></div>
</div>
<div class="boxes">
<div class="box"><h3>输入</h3><p>岷江水（含泥沙）、水流能量</p></div>
<div class="box"><h3>过程</h3><p>鱼嘴分水 → 弯道环流排沙 → 飞沙堰溢洪 → 宝瓶口引水</p></div>
<div class="box"><h3>输出</h3><p>灌溉用水（内江）、排洪排沙（外江）</p></div>
<div class="box"><h3>反馈</h3><p>水位 ↑ → 飞沙堰溢流 ↑ → 内江水位 ↓（负反馈）</p></div>
</div></div></body></html>
